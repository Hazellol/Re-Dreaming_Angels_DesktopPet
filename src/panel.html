<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>妄想天使 · 控制台</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; user-select: none; }
  body {
    background:
      radial-gradient(circle at 8% 12%, rgba(255, 255, 255, .75), transparent 30%),
      radial-gradient(circle at 92% 88%, rgba(255, 174, 213, .6), transparent 34%),
      linear-gradient(160deg, #fff6fa 0%, #ffe9f4 60%, #ffd9ec 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #3f3140;
  }
  /* 标题栏（可拖动） */
  #titlebar {
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px 0 16px;
    -webkit-app-region: drag;
    border-bottom: 2px dashed rgba(224, 85, 154, .35);
  }
  #titlebar .t-title { font: 800 16px/1 "Microsoft YaHei"; letter-spacing: 1px; color: #d0408a; }
  #titlebar .t-sub { font: 400 11px/1 "Microsoft YaHei"; color: #b09aa8; margin-top: 3px; }
  #btn-quit {
    -webkit-app-region: no-drag;
    font: 600 12px/1 "Microsoft YaHei";
    color: #9a8f9e; border: 2px solid #e8dbe6; border-radius: 10px;
    padding: 6px 12px; cursor: pointer; background: rgba(255,255,255,.7);
  }
  #btn-quit:hover { color: #e0559a; border-color: #f5c0da; }
  #btn-min {
    -webkit-app-region: no-drag;
    width: 30px; height: 30px; line-height: 1;
    font: 700 16px/1 "Microsoft YaHei"; color: #9a8f9e;
    border: 2px solid #e8dbe6; border-radius: 10px;
    cursor: pointer; background: rgba(255,255,255,.7);
    display: flex; align-items: center; justify-content: center;
    margin-right: 8px;
  }
  #btn-min:hover { color: #e0559a; border-color: #f5c0da; }

  /* 主体：左侧栏 + 内容区 */
  #main-row { display: flex; height: calc(100vh - 44px); }
  #sidebar {
    width: 58px; flex: 0 0 58px;
    background: linear-gradient(180deg, #ffe3f0, #ffd4e9);
    border-right: 2px solid rgba(224, 85, 154, .25);
    display: flex; flex-direction: column; align-items: center;
    padding-top: 14px; gap: 12px;
  }
  .sidebar-btn {
    width: 40px; height: 40px; border-radius: 13px;
    background: #fff; border: 2px solid #f2cfe2;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #b06a93;
    transition: transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .sidebar-btn:hover { transform: translateY(-2px); color: #e0559a; box-shadow: 0 4px 10px rgba(224,85,154,.22); }
  .sidebar-btn.active {
    background: linear-gradient(135deg, #ffe3f0, #ffd0e6);
    border-color: #e0559a; color: #d0408a;
    box-shadow: 0 4px 12px rgba(224,85,154,.3);
  }
  #content { flex: 1; overflow: hidden; position: relative; }
  .view { position: absolute; inset: 0; padding: 14px 20px 10px; }
  .view-swap { animation: viewIn .22s cubic-bezier(.2,.9,.3,1.05); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ============ 主页视图 ============ */
  #view-home { text-align: center; display: flex; flex-direction: column; justify-content: center; }
  #deco {
    display: flex; gap: 22px; justify-content: center; align-items: flex-end;
    padding: 14px 0 4px; flex: 0 0 auto;
  }
  .deco-note { font-size: 22px; color: #e8a8cc; animation: noteFloat 2.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes noteFloat { 0%,100% { transform: translateY(0); opacity: .45; } 50% { transform: translateY(-8px); opacity: .95; } }
  #cards {
    display: flex; gap: 18px; justify-content: center;
    padding: 10px 0 8px;
  }
  .card {
    width: 176px;
    background: #ffffff;
    border: 3px solid #3f3140;
    border-radius: 20px;
    padding: 12px 8px 12px;
    box-shadow: 0 6px 18px rgba(120, 40, 90, .18);
    text-align: center;
    transition: transform .15s ease, box-shadow .15s ease, opacity .2s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 7px;
    background: linear-gradient(90deg, #ff9fc9, #e0559a 55%, #b64a8c);
  }
  .card.off { opacity: .5; filter: grayscale(.7); }
  .card.off::before { background: linear-gradient(90deg, #d8c8d3, #b3a0ac); }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(120,40,90,.26); }
  .card .c-img {
    width: 124px; height: 124px; margin: 8px auto 6px;
    border-radius: 14px; overflow: hidden;
    background: linear-gradient(160deg, #fdf3f8, #f6e6f1);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .card .c-img img { max-width: 120px; max-height: 122px; object-fit: contain; }
  .card .c-name { font: 800 15px/1.2 "Microsoft YaHei"; color: #d0408a; letter-spacing: 2px; }
  .card .c-state {
    display: inline-block; margin-top: 6px;
    font: 700 11px/1.6 "Microsoft YaHei"; color: #e0559a;
    background: #ffe3f0; border-radius: 10px; padding: 2px 12px;
    transition: background .18s ease, color .18s ease;
  }
  .card.off .c-state { color: #8f8490; background: #e9e2e8; }
  .c-switch {
    position: relative; width: 50px; height: 25px; margin: 9px auto 2px;
    background: #e8dbe6; border-radius: 14px; cursor: pointer;
    border: 2px solid #3f3140;
    transition: background .18s ease;
  }
  .c-switch .knob {
    position: absolute; top: 1px; left: 1px; width: 19px; height: 19px;
    background: #ffffff; border-radius: 50%;
    box-shadow: 0 2px 5px rgba(0,0,0,.25);
    transition: transform .18s ease;
  }
  .c-switch.on { background: #e0559a; }
  .c-switch.on .knob { transform: translateX(25px); }
  #footer {
    display: flex; gap: 12px; justify-content: center; align-items: center;
    padding: 6px 0 8px;
  }
  .f-btn {
    font: 600 13px/1 "Microsoft YaHei";
    color: #3f3140; background: #ffffff;
    border: 2px solid #3f3140; border-radius: 12px;
    padding: 9px 18px; cursor: pointer;
    transition: transform .12s ease, background .12s ease;
  }
  .f-btn:hover { background: #ffd9ec; transform: translateY(-2px); }
  #hintline { text-align: center; font: 400 11px/1.6 "Microsoft YaHei"; color: #b09aa8; }

  /* ============ 对话配置视图 ============ */
  #view-ai { overflow-y: auto; padding: 16px 22px 12px; }
  .ai-card {
    background: #fff; border: 3px solid #3f3140; border-radius: 18px;
    padding: 16px 20px; margin-bottom: 14px;
    box-shadow: 0 5px 14px rgba(120, 40, 90, .13);
  }
  .ai-card h3 {
    margin: 0 0 12px; font: 800 15px/1.2 "Microsoft YaHei"; color: #d0408a;
    display: flex; align-items: center; gap: 6px;
  }
  .ai-row { display: flex; align-items: center; gap: 12px; margin: 11px 0; }
  .ai-row > label { flex: 0 0 110px; font: 600 13px/1.4 "Microsoft YaHei"; color: #7a6a74; }
  .ai-row input[type=text], .ai-row input[type=password], .ai-row select, .ai-row input[type=number] {
    flex: 1; min-width: 0; padding: 8px 11px;
    border: 2px solid #e8dbe6; border-radius: 10px;
    font: 600 13px/1.3 "Microsoft YaHei"; color: #3f3140; outline: none; background: #fffdfe;
  }
  .ai-row input:focus, .ai-row select:focus { border-color: #e0559a; }
  .ai-row input[type=range] { flex: 1; accent-color: #e0559a; }
  .ai-row .ai-val { flex: 0 0 42px; font: 700 12px/1 "Microsoft YaHei"; color: #d0408a; text-align: right; }
  .ai-row .ai-hint { flex: 0 0 auto; font: 11px/1.3 "Microsoft YaHei"; color: #b09aa8; }
  .ai-row.check { gap: 8px; }
  .ai-row.check input { accent-color: #e0559a; width: 16px; height: 16px; }
  .key-wrap { flex: 1; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .key-wrap input { flex: 1; min-width: 0; }
  .key-eye {
    flex: 0 0 30px; height: 30px; border: 2px solid #e8dbe6; border-radius: 9px;
    background: #fff; cursor: pointer; color: #b06a93;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .key-eye:hover { color: #e0559a; border-color: #f5c0da; }
  .ai-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .ai-btn {
    font: 700 12px/1 "Microsoft YaHei"; color: #3f3140;
    border: 2px solid #3f3140; border-radius: 10px; background: #fff;
    padding: 7px 12px; cursor: pointer;
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  .ai-btn:hover { background: #ffd9ec; transform: translateY(-1px); }
  .ai-btn.pink { background: #e0559a; color: #fff; border-color: #d0408a; }
  .ai-btn.pink:hover { background: #d0408a; }
  .ai-btn.small { font-size: 11px; padding: 5px 9px; border-width: 1.5px; }
  #ai-test-rslt { font: 600 12px/1.5 "Microsoft YaHei"; margin-top: 8px; min-height: 18px; }
  #ai-test-rslt.ok { color: #2e9e6b; }
  #ai-test-rslt.bad { color: #c05050; }
  #ai-status { text-align: center; font: 400 11px/1.6 "Microsoft YaHei"; color: #b09aa8; }
</style>
</head>
<body>
  <div id="titlebar">
    <div>
      <div class="t-title" id="t-title">🎀 妄想天使 · 控制台</div>
      <div class="t-sub" id="t-sub">分别控制三小只的桌宠开关（关掉后她会去休息哦～）</div>
    </div>
    <div style="display:flex;align-items:center;">
      <div id="btn-min" title="最小化（隐藏到任务栏）">—</div>
      <div id="btn-quit">退出桌宠</div>
    </div>
  </div>
  <div id="main-row">
    <div id="sidebar">
      <div class="sidebar-btn active" id="btn-home" title="主页">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11 L12 3 L21 11"/><path d="M5 10 V20 H19 V10"/><path d="M10 20 V14 H14 V20"/>
        </svg>
      </div>
      <div class="sidebar-btn" id="btn-ai" title="对话配置">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5 H20 V17 H10 L6 21 V17 H4 Z"/>
          <circle cx="9" cy="11" r="1" fill="currentColor" stroke="none"/>
          <circle cx="12.5" cy="11" r="1" fill="currentColor" stroke="none"/>
          <circle cx="16" cy="11" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </div>
    </div>
    <div id="content">
      <!-- 主页视图 -->
      <div id="view-home" class="view">
        <div id="cards"></div>
        <div id="footer">
          <div class="f-btn" id="btn-show">👀 显示/隐藏小偶像</div>
        </div>
        <div id="hintline">✕ 关闭本窗口不会停止桌宠（最小化到系统托盘） · 托盘点图标可随时找回</div>
        <div id="deco">
          <span class="deco-note" style="--d:0s">🎵</span>
          <span class="deco-note" style="--d:.7s">♪</span>
          <span class="deco-note" style="--d:1.3s">🎶</span>
        </div>
      </div>
      <!-- 对话配置视图（AI 聊天：DeepSeek） -->
      <div id="view-ai" class="view" style="display:none;">
        <div class="ai-card">
          <h3>🎛️ 对话配置（AI 聊天）</h3>
          <div class="ai-row">
            <label>运营商</label>
            <select id="ai-provider">
              <option value="deepseek">DeepSeek（deepseek.com）</option>
            </select>
          </div>
          <div class="ai-row">
            <label>API Key</label>
            <div class="key-wrap">
              <input type="password" id="ai-key" placeholder="sk-…（在 platform.deepseek.com 申请）">
              <span class="key-eye" id="ai-key-eye" title="显示/隐藏">👁</span>
            </div>
          </div>
          <div class="ai-row">
            <label>模型</label>
            <select id="ai-model">
              <option value="deepseek-v4-flash">deepseek-v4-flash（对话快）</option>
              <option value="deepseek-v4-pro">deepseek-v4-pro（更强）</option>
            </select>
          </div>
          <div class="ai-row">
            <label>温度</label>
            <input type="range" id="ai-temp" min="0" max="2" step="0.1" value="1.0">
            <span class="ai-val" id="ai-temp-val">1.0</span>
            <span class="ai-hint">越高越活泼</span>
          </div>
          <div class="ai-row">
            <label>回复字数上限</label>
            <input type="number" id="ai-max" min="32" max="2048" step="16" value="256">
            <span class="ai-hint">token</span>
          </div>
          <div class="ai-row">
            <label>上下文轮数</label>
            <input type="number" id="ai-rounds" min="2" max="100" step="1" value="20">
            <span class="ai-hint">条（取最近，历史全存）</span>
          </div>
          <div class="ai-row">
            <label>聊天样式</label>
            <select id="ai-mode">
              <option value="panel">手机对话样式（聊天面板）</option>
              <option value="bubble">头顶气泡样式（角色下方输入）</option>
            </select>
          </div>
          <div class="ai-row check">
            <label>联网模式</label>
            <input type="checkbox" id="ai-web" title="开启后使用联网版人设（被问到人设外信息会主动联网搜索）">
            <span class="ai-hint">人设外知识自动联网搜索（服务端 web_search）</span>
          </div>
          <div class="ai-row check">
            <label>保存历史对话</label>
            <input type="checkbox" id="ai-history" checked>
            <span class="ai-hint">存在本地 data/chat_*.json，下次接上</span>
          </div>
          <div style="margin-top:14px;">
            <button class="ai-btn pink" id="ai-save" style="width:100%;padding:10px 0;font-size:13px;">💾 保存配置（立即生效）</button>
          </div>
        </div>
        <div class="ai-card">
          <h3>🔧 测试与清理</h3>
          <div class="ai-btns">
            <button class="ai-btn pink" id="ai-test">⚡ 连接测试</button>
            <button class="ai-btn" id="ai-reset">↺ 重置数字配置</button>
            <button class="ai-btn small" id="ai-clear-1">清空爱芮历史</button>
            <button class="ai-btn small" id="ai-clear-2">清空南宫历史</button>
            <button class="ai-btn small" id="ai-clear-3">清空千夏历史</button>
          </div>
          <div id="ai-test-rslt"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
